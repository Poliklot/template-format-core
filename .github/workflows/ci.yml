name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Node ${{ matrix.node }} / Prettier ${{ matrix.prettier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        prettier: ["3.0.0", "3.9.6"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --legacy-peer-deps prettier@${{ matrix.prettier }}
      - run: npm run check
      - run: npm pack --dry-run
